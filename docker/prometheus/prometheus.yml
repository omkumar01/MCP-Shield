# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Prometheus Configuration for MCP-Shield                                      │
# │                                                                              │
# │ Scrapes metrics from MCP-Shield, infrastructure, and applications.          │
# └──────────────────────────────────────────────────────────────────────────────┘

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local'
    environment: 'development'
    team: 'platform'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Uncomment and configure for production:
      # - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus self-monitoring
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP-Shield Gateway
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'mcp-shield'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - mcp-shield
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: app

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP-Shield (Docker Compose - Local Development)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'mcp-shield-docker'
    static_configs:
      - targets: ['mcp-shield:9090']
        labels:
          service: 'mcp-shield'
          deployment: 'docker-compose'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP Echo Server
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'mcp-echo'
    static_configs:
      - targets: ['mcp-echo:8080']
        labels:
          service: 'mcp-echo'
          deployment: 'docker-compose'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # Node Exporter (Host Metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
    # For Kubernetes, use:
    # kubernetes_sd_configs:
    #   - role: node
    # relabel_configs:
    #   - action: labelmap
    #     regex: __meta_kubernetes_node_label_(.+)

  # ─────────────────────────────────────────────────────────────────────────────
  # cAdvisor (Container Metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'cadvisor'
    # For Kubernetes, use kubelet/cadvisor endpoints

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL (via postgres_exporter)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
        labels:
          service: 'postgres'
          component: 'database'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis (via redis_exporter)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # OpenTelemetry Collector
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          component: 'telemetry'
    scrape_interval: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # Loki
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          component: 'logging'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Jaeger
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          service: 'jaeger'
          component: 'tracing'
    scrape_interval: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Blackbox Exporter (Endpoint Probing)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://mcp-shield:8080/health
          - http://mcp-shield:8080/ready
          - http://mcp-echo:8080/health
        labels:
          service: 'blackbox-http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ─────────────────────────────────────────────────────────────────────────────
  # Kubernetes Cluster Metrics (kube-state-metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']
        labels:
          service: 'kube-state-metrics'
    scrape_interval: 30s

