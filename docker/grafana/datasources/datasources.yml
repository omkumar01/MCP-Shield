# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Grafana Datasources Configuration                                            │
# │                                                                              │
# │ Automatically provisioned datasources for MCP-Shield observability stack.   │
# └──────────────────────────────────────────────────────────────────────────────┘

apiVersion: 1

datasources:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus (Metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: jaeger
    secureJsonData: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # Loki (Logs)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceID
          matcherRegex: "trace[=: ]+([a-f0-9]{32})"
          url: '${{__value.raw}}'
          datasourceUid: jaeger
    secureJsonData: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # Jaeger (Traces)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ['service.name', 'service.namespace']
        spanStartTimeShift: "1s"
        spanEndTimeShift: "-1s"
      nodeGraph:
        enabled: true
    secureJsonData: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # Tempo (Alternative to Jaeger - for production)
  # ─────────────────────────────────────────────────────────────────────────────
  # - name: Tempo
  #   type: tempo
  #   uid: tempo
  #   access: proxy
  #   url: http://tempo:3200
  #   editable: false
  #   jsonData:
  #     tracesToLogs:
  #       datasourceUid: loki
  #       tags: ['service.name', 'service.namespace']
  #       spanStartTimeShift: "1s"
  #       spanEndTimeShift: "-1s"
