# Default values for MCP-Shield.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: mcpshield/mcp-shield
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-shield.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# MCP-Shield configuration (rendered into a ConfigMap)
config:
  server:
    bind_addr: "0.0.0.0:8080"
    log_level: "info"
    json_logging: true
    enable_http: true
    enable_sse: true
    enable_stdio: false
    server_info:
      name: "mcp-shield"
      version: "0.1.0"

  auth:
    enabled: false
    # Set via secrets in production
    # jwt_secret: ""
    # jwks_url: ""
    required_scopes:
      - "mcp:tools:read"
      - "mcp:tools:call"

  registry:
    enforce_prefix_format: true
    allowed_prefixes: []

  telemetry:
    metrics_path: "/metrics"
    metrics_addr: "0.0.0.0:9090"
    kafka_bootstrap_servers: []
    kafka_topic: "mcp-shield-audit"

# External dependencies (Phase 2-4)
postgresql:
  enabled: false

redpanda:
  enabled: false

clickhouse:
  enabled: false
