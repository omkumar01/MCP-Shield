# Development values for MCP-Shield
# Use with: helm install mcp-shield ./helm/mcp-shield -f helm/mcp-shield/values-dev.yaml

replicaCount: 1

image:
  repository: mcpshield/mcp-shield
  tag: dev
  pullPolicy: Never

service:
  type: NodePort
  port: 8080

config:
  server:
    log_level: "debug"
    json_logging: false
    bind_addr: "0.0.0.0:8080"
    enable_http: true
    enable_sse: true
    enable_stdio: false

  auth:
    enabled: false

  registry:
    enforce_prefix_format: true
    allowed_prefixes: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
