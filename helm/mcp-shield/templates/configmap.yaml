apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-shield.fullname" . }}-config
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
data:
  default.toml: |
    {{- .Values.config | toYaml | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-shield.fullname" . }}-policies
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
data:
  default.cedar: |
    // MCP-Shield default Cedar policy
    permit (
        principal,
        action,
        resource
    );
