[package]
name = "mcp-shield"
version = "0.1.0"
edition = "2024"
description = "Layer 7 protocol-aware security gateway for the Model Context Protocol (MCP)"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/mcp-shield/mcp-shield"
readme = "README.md"
keywords = ["mcp", "security", "gateway", "json-rpc", "oauth"]
categories = ["network-programming", "security"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework + SSE
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

# JSON-RPC 2.0
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }

# JSON Schema 2020-12
jsonschema = "0.22"
schemars = "1.0"

# JWT + OAuth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json"] }

# Cedar policy engine (minimal use in Phase 1, full in Phase 2)
cedar-policy = "4.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tokio-test = "0.4"
axum-test = "16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true