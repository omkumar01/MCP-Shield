# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ MCP-Shield Release Pipeline                                                    │
# │                                                                              │
# │ Handles: Docker image building, multi-arch publishing, signing, SBOM         │
# │ generation, Helm chart packaging and publishing.                            │
# └──────────────────────────────────────────────────────────────────────────────┘

name: Release Pipeline

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.1.0)"
        type: string
        required: true
      release_type:
        description: "Release type"
        type: choice
        options: [stable, rc, beta, alpha]
        default: stable

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

# ─────────────────────────────────────────────────────────────────────────────
# Environment Variables
# ─────────────────────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUST_VERSION: "1.97"

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Extract Version Information
  # ═══════════════════════════════════════════════════════════════════════════════
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      major: ${{ steps.extract.outputs.major }}
      minor: ${{ steps.extract.outputs.minor }}
      patch: ${{ steps.extract.outputs.patch }}
      prerelease: ${{ steps.extract.outputs.prerelease }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Parse semver
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            echo "major=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "minor=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "patch=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              echo "prerelease=${BASH_REMATCH[4]#-}" >> $GITHUB_OUTPUT
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Invalid version format: $VERSION"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # Build Docker Image (per-arch, native runners — no QEMU)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Each architecture builds natively on its own runner (amd64 on ubuntu-latest,
  # arm64 on GitHub's free native ARM runner). This avoids QEMU emulation, which
  # was timing out (>45 min) for the Rust arm64 build.
  docker-build-arch:
    name: Build Image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: version
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare (lowercase image name)
        id: prep
        # Docker repositories must be lowercase; github.repository may contain
        # uppercase (e.g. omkumar01/MCP-Shield). docker/metadata-action
        # lowercases automatically, but our custom per-arch tags do not.
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push single-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Per-arch tag so the two parallel jobs don't clobber each other;
          # the multi-arch manifest is created in the merge job below.
          tags: ${{ steps.prep.outputs.image }}:sha-${{ github.sha }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.title=MCP-Shield
            org.opencontainers.image.description=Layer 7 protocol-aware security gateway for the Model Context Protocol (MCP)
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
            RUST_VERSION=${{ env.RUST_VERSION }}
            TARGETARCH=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          provenance: false

      - name: Export per-arch digest
        id: digest
        run: echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════════════════════
  # Merge per-arch images into a single multi-arch manifest
  # ═══════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [version, docker-build-arch]
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      image-ref: ${{ steps.merge.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (final tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Merge amd64 + arm64 into a multi-arch manifest
        id: merge
        run: |
          set -euo pipefail
          # Docker repositories must be lowercase.
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          # Per-arch images were pushed under arch-specific tags by the matrix job.
          AMD64_TAG="${IMAGE}:sha-${GITHUB_SHA}-amd64"
          ARM64_TAG="${IMAGE}:sha-${GITHUB_SHA}-arm64"
          echo "Source images: $AMD64_TAG , $ARM64_TAG"

          # docker/metadata-action outputs tags as a newline-separated list.
          TAGS_OUT="${{ steps.meta.outputs.tags }}"

          # Create the multi-arch manifest under each final tag.
          FIRST_TAG=""
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            [ -z "$FIRST_TAG" ] && FIRST_TAG="$TAG"
            echo "Creating multi-arch manifest for $TAG"
            docker buildx imagetools create -t "$TAG" "$AMD64_TAG" "$ARM64_TAG"
          done <<< "$TAGS_OUT"

          # Inspect the first final tag to obtain the multi-arch manifest digest.
          echo "Inspecting merged manifest: $FIRST_TAG"
          docker buildx imagetools inspect "$FIRST_TAG"
          MERGED_DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')
          echo "Merged multi-arch manifest digest: $MERGED_DIGEST"
          echo "digest=$MERGED_DIGEST" >> $GITHUB_OUTPUT

          # Output the full image reference (registry/image@digest) for downstream jobs.
          IMAGE_REF="${IMAGE}@${MERGED_DIGEST}"
          echo "Full image reference: $IMAGE_REF"
          echo "image-ref=$IMAGE_REF" >> $GITHUB_OUTPUT

      - name: Output image digest
        run: |
          echo "Image digest: ${{ steps.merge.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo "Full image ref: ${{ steps.merge.outputs.image-ref }}"

  # ═══════════════════════════════════════════════════════════════════════════════
  # Sign Container Image (Cosign/Sigstore)
  # ═══════════════════════════════════════════════════════════════════════════════
  sign-image:
    name: Sign Container Image
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            --annotations "version=${{ needs.version.outputs.version }}" \
            --annotations "git-sha=${{ github.sha }}" \
            --annotations "git-ref=${{ github.ref }}" \
            ${{ needs.docker-build.outputs.image-ref }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            ${{ needs.docker-build.outputs.image-ref }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # Generate SBOM
  # ═══════════════════════════════════════════════════════════════════════════════
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.0

      - name: Generate SBOM (SPDX)
        run: |
          syft scan "${{ needs.docker-build.outputs.image-ref }}" \
            -o spdx-json=sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        run: |
          syft scan "${{ needs.docker-build.outputs.image-ref }}" \
            -o cyclonedx-json=sbom.cyclonedx.json

      - name: Generate SBOM (Table)
        run: |
          syft scan "${{ needs.docker-build.outputs.image-ref }}" \
            -o table=sbom.table.txt

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            sbom.table.txt
          retention-days: 90

      - name: Install Cosign (for syft attest)
        uses: sigstore/cosign-installer@v3

      - name: Attach SBOM to container image
        run: |
          syft attest "${{ needs.docker-build.outputs.image-ref }}" -o spdx-json=sbom.spdx.json

  # ═══════════════════════════════════════════════════════════════════════════════
  # Scan Container Image (Trivy, Grype)
  # ═══════════════════════════════════════════════════════════════════════════════
  scan-image:
    name: Scan Container Image
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 20
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.docker-build.outputs.image-ref }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image

      - name: Run Grype vulnerability scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype "${{ needs.docker-build.outputs.image-ref }}" -o json > grype-results.json

      - name: Upload Grype results
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: grype-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════
  # Build & Push Helm Chart
  # ═══════════════════════════════════════════════════════════════════════════════
  helm-package:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [version, docker-build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up chart dependencies
        run: |
          helm dependency update helm/mcp-shield

      - name: Lint Helm chart
        run: |
          helm lint helm/mcp-shield \
            --set image.tag=${{ needs.version.outputs.version }} \
            --set image.digest=${{ needs.docker-build.outputs.digest }}

      - name: Package Helm chart
        run: |
          helm package helm/mcp-shield \
            --version ${{ needs.version.outputs.version }} \
            --app-version ${{ needs.version.outputs.version }} \
            --destination /tmp/helm-charts

      - name: Sign Helm chart
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Sign Helm chart with Cosign
        run: |
          cosign sign-blob --yes \
            --output-signature /tmp/helm-charts/mcp-shield-${{ needs.version.outputs.version }}.tgz.sig \
            /tmp/helm-charts/mcp-shield-${{ needs.version.outputs.version }}.tgz

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI registry
        run: |
          helm push /tmp/helm-charts/mcp-shield-${{ needs.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Upload Helm chart as artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/helm-charts/mcp-shield-${{ needs.version.outputs.version }}.tgz
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, docker-build, sign-image, sbom, scan-image, helm-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom

      - name: Download Helm chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/helm

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%an)" $PREV_TAG..HEAD > /tmp/changelog.md
          else
            git log --pretty=format:"- %s (%an)" > /tmp/changelog.md
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MCP-Shield ${{ needs.version.outputs.version }}
          body: |
            ## MCP-Shield ${{ needs.version.outputs.version }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ### Docker Images
            ```bash
            # Multi-arch image (linux/amd64, linux/arm64)
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            
            # By digest (immutable)
            docker pull ghcr.io/${{ github.repository }}@${{ needs.docker-build.outputs.digest }}
            ```
            
            ### Helm Chart
            ```bash
            helm install mcp-shield oci://ghcr.io/${{ github.repository_owner }}/charts/mcp-shield \
              --version ${{ needs.version.outputs.version }}
            ```
            
            ### SBOM
            - [SPDX JSON](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/sbom.spdx.json)
            - [CycloneDX JSON](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/sbom.cyclonedx.json)
            
            ### Verification
            - Image signed with Cosign/Sigstore
            - SBOM attached to image
            - Vulnerability scanned with Trivy and Grype
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          files: |
            /tmp/sbom/sbom.spdx.json
            /tmp/sbom/sbom.cyclonedx.json
            /tmp/sbom/sbom.table.txt
            /tmp/helm/mcp-shield-${{ needs.version.outputs.version }}.tgz
            /tmp/helm/mcp-shield-${{ needs.version.outputs.version }}.tgz.sig